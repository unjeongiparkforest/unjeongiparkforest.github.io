<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>운정 아이파크 포레스트 입주예정자협의회</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="입주민들의 의견 파워 - 위임장 작성하기">
  <meta property="og:description" content="위임장 작성, 제출 현황, 정회원 가입 안내를 한 곳에서 확인하세요.">
  <meta property="og:image" content="https://unjeongiparkforest.github.io/kakao_link_card/banner.png">
  <meta property="og:url" content="https://unjeongiparkforest.github.io/">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* 목적지가 셋으로 늘어 콘텐츠가 뷰포트를 넘긴다. 세로 가운데 정렬을 쓰면
       넘치는 순간 위쪽이 잘려 스크롤로도 닿지 않으므로 위에서부터 쌓는다. */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: #f4f5f7; min-height: 100vh; color: #222;
      display: flex; flex-direction: column; align-items: center;
      padding: 24px 16px 40px;
    }
    /* member.html과 같은 폭·카드 모양을 쓴다. 두 페이지를 오갈 때 같은 사이트로 읽히게 한다. */
    .wrap { max-width: 560px; width: 100%; }

    .banner { display:block; width:100%; border-radius:16px; overflow:hidden;
      box-shadow:0 6px 24px rgba(0,0,0,.12); line-height:0;
      transition:transform .12s ease, box-shadow .15s ease; }
    .banner:hover { transform: translateY(-2px); box-shadow:0 10px 32px rgba(0,0,0,.18); }
    .banner:active { transform: translateY(0); }
    .banner img { width:100%; height:auto; display:block; }

    /* 배너가 위임장 작성으로 가는 유일한 경로다. 눌리는 줄 모르는 사람이 있어
       버튼 대신 한 줄만 둔다. 버튼(약 70px)보다 훨씬 싸다. */
    .banner-cue { margin-top: 9px; font-size: 12px; color: #999; text-align: center; }

    /* 위임장 작성 주의사항이므로 배너 바로 아래에 둔다. 아래 메뉴 카드의 설명으로 읽히면 안 된다. */
    .hint { margin-top: 12px; font-size: 12.5px; color: #666; line-height: 1.7; }

    .menu { margin-top: 18px; display:flex; flex-direction:column; gap:12px; }
    .status-link {
      display:flex; align-items:center; justify-content:space-between; gap:14px;
      background:#fff; border-radius:16px; padding:18px 20px;
      text-decoration:none; color:#222;
      box-shadow:0 2px 10px rgba(0,0,0,.07);
      transition:transform .12s ease, box-shadow .15s ease;
    }
    .status-link:hover { transform: translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.12); }
    .status-link .label { display:block; font-size:15.5px; font-weight:800; }
    .status-link .desc { display:block; margin-top:4px; font-size:13px; color:#777; line-height:1.5; }
    /* 수치를 쓰는 카드는 현황뿐이다. 장식인 chevron과 색·굵기를 갈라 둬야
       정회원 카드가 "수치가 안 나온 현황"으로 읽히지 않는다. */
    .status-link .rate { font-size:19px; font-weight:800; color:#2f6fed; white-space:nowrap; }
    .status-link .go { font-size:20px; color:#c4c8d0; white-space:nowrap; }

    .foot { margin-top: 20px; text-align:center; }
    .foot .cafe { display:inline-block; font-size:13.5px; color:#2f6fed;
      text-decoration:none; font-weight:600; }
    .foot .cafe:hover { text-decoration: underline; }
    .foot .org { margin-top:8px; font-size:12px; color:#aaa; line-height:1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="banner" href="https://consent.taesunglaw.com/consent/UIF01/14">
      <img src="kakao_link_card/banner.png" alt="입주민들의 의견 파워 - 위임장 작성하기">
    </a>
    <p class="banner-cue">이미지를 누르면 위임장 작성 화면으로 이동합니다.</p>

    <p class="hint">
      ※ 계약서 첨부 시 주민등록번호 뒷자리를 가려주시고, 계약자 및 공동명의인의 주소는
      본인 확인을 위해 현재 거주 중인 주소로 입력해 주세요.
    </p>

    <div class="menu">
      <a class="status-link" href="status.html">
        <span>
          <span class="label">위임장 제출 현황</span>
          <span class="desc">동별 제출 상황을 한눈에 볼 수 있습니다.</span>
        </span>
        <span class="rate">22.2%</span>
      </a>
      <a class="status-link" href="member.html">
        <span>
          <span class="label">정회원 가입 안내</span>
          <span class="desc">회비, 입금 계좌, 가입 절차와 특별 혜택을 확인하세요.</span>
        </span>
        <span class="go" aria-hidden="true">›</span>
      </a>
    </div>

    <div class="foot">
      <a class="cafe" href="https://cafe.naver.com/unjeongiparkforest">네이버 카페 바로가기 ›</a>
      <p class="org">
        문의사항은 카페 또는 운영진에게 남겨주세요.<br>
        운정 아이파크 포레스트 입주예정자협의회
      </p>
    </div>
  </div>
</body>
</html>
