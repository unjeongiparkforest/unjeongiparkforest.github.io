<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>입주민들의 의견 파워 - 위임장 작성하기</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="입주민들의 의견 파워 - 위임장 작성하기">
  <meta property="og:description" content="이미지를 눌러 위임장 작성 화면으로 이동하세요.">
  <meta property="og:image" content="https://unjeongiparkforest.github.io/kakao-link-card/banner.png">
  <meta property="og:url" content="https://unjeongiparkforest.github.io/kakao-link-card/">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Noto Sans KR", "Malgun Gothic", sans-serif;
      background: #f4f5f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #222;
    }
    .banner {
      display: block;
      max-width: 520px;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
      transition: transform .12s ease, box-shadow .15s ease;
      line-height: 0;
    }
    .banner:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(0, 0, 0, 0.18); }
    .banner:active { transform: translateY(0); }
    .banner img { width: 100%; height: auto; display: block; }
    .hint { margin-top: 18px; font-size: 15px; color: #555; text-align: center; }
    .hint a { color: #2f6fed; text-decoration: none; }
    .hint a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <!-- 배너 이미지를 누르면 위임장 작성 화면으로 이동합니다.
       banner.png 를 실제 배너 이미지 파일 이름으로 맞추세요. -->
  <a class="banner" href="https://consent.taesunglaw.com/consent/UIF01/14">
    <img src="banner.png" alt="입주민들의 의견 파워 - 위임장 작성하기">
  </a>

  <p class="hint">
    이미지를 눌러 위임장 작성 화면으로 이동하세요.<br>
    <a href="https://consent.taesunglaw.com/consent/UIF01/14">또는 여기를 눌러주세요.</a>
  </p>
</body>
</html>
